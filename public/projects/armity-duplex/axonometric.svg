<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="gridDuplex" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="currentColor" stroke-opacity="0.08" stroke-width="0.8" />
    </pattern>
    <linearGradient id="armityGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cc2b43" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#db4d24" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#gridDuplex)" />

  <!-- Drawing Title & Stage Tracker -->
  <g font-family="monospace" font-size="11" fill="currentColor" opacity="0.7">
    <text x="30" y="35" font-weight="bold" letter-spacing="1.5">FIG 05.1 // STRUCTURAL STAGE &amp; MASSING AXONOMETRIC</text>
    <text x="30" y="52">ARMITY ESTATE DUPLEX • EJIOKU VILLAGE • STATUS: 1ST FLOOR CONSTRUCTION</text>
    <text x="730" y="35" text-anchor="end">REV. 02</text>
  </g>

  <!-- Ground Plane Grid & Perimeter Wall -->
  <g stroke="currentColor" stroke-opacity="0.25" stroke-width="1.2">
    <polygon points="120,410 400,480 700,370 420,300" stroke-dasharray="3 3" />
    <!-- Driveway outline -->
    <path d="M 220,435 Q 360,420 400,480" stroke="currentColor" stroke-opacity="0.3" stroke-width="1.5" />
  </g>

  <!-- Ground Floor Level (COMPLETED) -->
  <g stroke="#16a34a" stroke-width="2" fill="#16a34a" fill-opacity="0.08">
    <polygon points="260,370 440,410 440,290 260,250" />
    <polygon points="440,410 560,360 560,240 440,290" fill-opacity="0.15" />
    <!-- Double-height Glass Atrium Box (Left Tower) -->
    <polygon points="260,370 340,390 340,150 260,130" stroke="#cc2b43" stroke-width="2" fill="#cc2b43" fill-opacity="0.12" />
    <line x1="300" y1="380" x2="300" y2="140" stroke="#cc2b43" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="260" y1="250" x2="340" y2="270" stroke="#cc2b43" stroke-width="1" />
  </g>

  <!-- Decking Slab Level (COMPLETED) -->
  <g stroke="#16a34a" stroke-width="3">
    <polygon points="250,250 450,295 570,245 370,200" fill="#16a34a" fill-opacity="0.2" />
  </g>

  <!-- First Floor Construction Level & Balcony Cantilever (IN PROGRESS) -->
  <g stroke="#db4d24" stroke-width="2" fill="#db4d24" fill-opacity="0.08">
    <!-- Cantilevered Master Balcony -->
    <polygon points="370,277 560,320 560,220 370,180" stroke-dasharray="4 2" />
    <polygon points="560,320 620,295 620,200 560,220" stroke-dasharray="4 2" fill-opacity="0.14" />
    <!-- Vertical Architectural Louver Screen -->
    <line x1="430" y1="290" x2="430" y2="200" stroke="#db4d24" stroke-width="2.5" />
    <line x1="440" y1="292" x2="440" y2="202" stroke="#db4d24" stroke-width="2.5" />
    <line x1="450" y1="294" x2="450" y2="204" stroke="#db4d24" stroke-width="2.5" />
  </g>

  <!-- Roof Parapet Cap -->
  <polygon points="250,130 350,150 450,120 350,100" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="2 2" fill="none" />

  <!-- Progress Annotation Callouts -->
  <g font-family="monospace" font-size="10" fill="currentColor">
    <!-- Callout 1: Ground Floor Completed -->
    <line x1="380" y1="360" x2="480" y2="430" stroke="#16a34a" stroke-width="1.2" />
    <circle cx="380" cy="360" r="3.5" fill="#16a34a" />
    <text x="490" y="425" font-weight="bold" fill="#16a34a">✓ GROUND FLOOR LEVEL</text>
    <text x="490" y="438" opacity="0.8">Completed reinforced concrete frame</text>

    <!-- Callout 2: Decking Completed -->
    <line x1="510" y1="270" x2="620" y2="270" stroke="#16a34a" stroke-width="1.2" />
    <circle cx="510" cy="270" r="3.5" fill="#16a34a" />
    <text x="630" y="265" font-weight="bold" fill="#16a34a">✓ SUSPENDED DECKING SLAB</text>
    <text x="630" y="278" opacity="0.8">Cast &amp; cured reinforced slab (Completed)</text>

    <!-- Callout 3: First Floor Construction Ongoing -->
    <line x1="480" y1="230" x2="590" y2="160" stroke="#db4d24" stroke-width="1.2" />
    <circle cx="480" cy="230" r="3.5" fill="#db4d24" />
    <text x="600" y="155" font-weight="bold" fill="#db4d24">● FIRST FLOOR CONSTRUCTION</text>
    <text x="600" y="168" opacity="0.8">Active stage: blockwork &amp; cantilevered balcony</text>

    <!-- Callout 4: Double Height Glazed Atrium -->
    <line x1="300" y1="200" x2="160" y2="200" stroke="#cc2b43" stroke-width="1.2" />
    <circle cx="300" cy="200" r="3.5" fill="#cc2b43" />
    <text x="30" y="195" font-weight="bold" fill="#cc2b43">DOUBLE-HEIGHT GLASS ATRIUM</text>
    <text x="30" y="208" opacity="0.8">Full-height curtain glazing &amp; brickwork tower</text>
  </g>
</svg>
