<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="gridFoundry" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="currentColor" stroke-opacity="0.08" stroke-width="0.8" />
    </pattern>
  </defs>

  <rect width="800" height="480" fill="url(#gridFoundry)" />

  <g font-family="monospace" font-size="11" fill="currentColor" opacity="0.6">
    <text x="30" y="35" font-weight="bold" letter-spacing="1.5">FIG 04.1 // BOILERHOUSE 'BOX-WITHIN-A-BOX' ADAPTIVE AXONOMETRIC</text>
    <text x="30" y="52">SCALE: 1:150 @ A1 • HISTORIC 1912 RIVETED STEEL FRAME &amp; SUSPENDED TIMBER PODS</text>
    <text x="730" y="35" text-anchor="end">REV. 01</text>
  </g>

  <!-- Outer Historic 1912 Masonry & Truss Skeleton -->
  <g stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5">
    <!-- Ground perimeter -->
    <polygon points="120,400 400,470 700,380 420,310" stroke-dasharray="3 3" />
    <!-- Vertical columns -->
    <line x1="120" y1="400" x2="120" y2="180" />
    <line x1="400" y1="470" x2="400" y2="250" />
    <line x1="700" y1="380" x2="700" y2="160" />
    <line x1="420" y1="310" x2="420" y2="90" />
    <!-- Roof pitched trusses -->
    <line x1="120" y1="180" x2="270" y2="135" />
    <line x1="400" y1="250" x2="270" y2="135" />
    <line x1="400" y1="250" x2="560" y2="125" />
    <line x1="700" y1="160" x2="560" y2="125" />
    <line x1="270" y1="135" x2="560" y2="125" stroke-dasharray="2 2" />
  </g>

  <!-- Suspended Overhead Gantry Crane Rail -->
  <g stroke="#db4d24" stroke-width="2.2" opacity="0.85">
    <line x1="180" y1="210" x2="640" y2="190" />
    <line x1="220" y1="260" x2="680" y2="240" />
  </g>

  <!-- Suspended Modern Art Pods (Box-within-a-box) -->
  <g stroke="#cc2b43" stroke-width="2" fill="#cc2b43" fill-opacity="0.14">
    <!-- Art Pod 1 (West suspended) -->
    <polygon points="200,320 280,340 280,260 200,240" />
    <polygon points="280,340 350,320 350,240 280,260" fill-opacity="0.22" />
    <polygon points="200,240 280,260 350,240 270,220" fill-opacity="0.3" />

    <!-- Art Pod 2 (East Mezzanine) -->
    <polygon points="460,320 540,340 540,260 460,240" />
    <polygon points="540,340 610,320 610,240 540,260" fill-opacity="0.22" />
    <polygon points="460,240 540,260 610,240 530,220" fill-opacity="0.3" />
  </g>

  <!-- Connecting Sky Bridge -->
  <line x1="350" y1="280" x2="460" y2="280" stroke="#cc2b43" stroke-width="3" />
  <line x1="350" y1="285" x2="460" y2="285" stroke="#cc2b43" stroke-width="1" stroke-dasharray="3 2" />

  <!-- Subterranean Mine Shaft Geothermal Heat Loop -->
  <g stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="4 3" opacity="0.8">
    <line x1="400" y1="470" x2="400" y2="440" />
    <path d="M 400,470 L 400,490 L 480,490" />
    <text x="490" y="493" font-family="monospace" font-size="9" fill="#3b82f6">450M MINE-WATER GEOTHERMAL LOOP</text>
  </g>

  <!-- Callouts -->
  <g font-family="monospace" font-size="10" fill="currentColor">
    <line x1="280" y1="240" x2="280" y2="150" stroke="#cc2b43" stroke-width="1" />
    <line x1="280" y1="150" x2="190" y2="150" stroke="#cc2b43" stroke-width="1" />
    <circle cx="280" cy="240" r="3" fill="#cc2b43" />
    <text x="40" y="145" font-weight="bold" fill="#cc2b43">SUSPENDED TIMBER PODS</text>
    <text x="40" y="159" opacity="0.7">Autonomous climate-controlled gallery</text>

    <line x1="640" y1="190" x2="710" y2="190" stroke="#db4d24" stroke-width="1" />
    <circle cx="640" cy="190" r="3" fill="#db4d24" />
    <text x="715" y="185" font-weight="bold" fill="#db4d24">OVERHEAD GANTRY RAIL</text>
    <text x="715" y="199" opacity="0.7">1912 Restored load-bearing crane</text>
  </g>
</svg>
